name: CI

on: [push, pull_request]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: styfle/cancel-workflow-action@0.13.1
      - uses: actions/checkout@v7
      - name: Get current date for caching
        id: get-date
        shell: bash
        run: |
          echo date=$(date -u +%Y-%m-%d) >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        id: cache
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ steps.get-date.outputs.date }}
      - name: Install Rust and Garden
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          cargo install garden-tools
      - name: Install system-provided test dependencies
        run: sudo apt-get update
      - run: |
          sudo apt-get install -y \
            nsis \
            python3-qtpy \
            python3-pyqt6 \
            python3-pyqt6.qtsvg \
            python3-pyqt6.qtwebengine \
            python3-send2trash
      - name: Install pip-provided test dependencies
        run: |
          set -x
          garden dev/virtualenv -vv -D pip-upgrade=true
          garden dev -vv
      - name: Configure tests
        run: |
          git config --global user.name "Git Cola"
          git config --global user.email git-cola@localhost
      - name: Run tests
        run: garden test -vv -- -p no:ruff
      - name: Ruff history tests
        run: >-
          env3/bin/python -m ruff check
          test/widgets_dag_history_test.py
          test/widgets_main_history_test.py
      - name: Run doc build
        run: garden doc/html -vv
      - name: Build Windows git-cola.exe installer
        run: |
          set -x
          rm -fr build
          garden pynsist -vv
          mv build/nsis/git-cola*.exe git-cola.exe
      - name: Upload git-cola.win.zip
        uses: actions/upload-artifact@v7
        with:
          name: git-cola.win
          path: git-cola.exe
      - name: Code formatting
        run: garden check/fmt -vv
      - name: Pyupgrade checks
        run: garden check/pyupgrade -vv
      - name: Type checks
        run: garden check/mypy -vv
      - name: Test the garden installation method
        run: garden install -vv -D prefix=dist

  history-paint:
    name: History paint (${{ matrix.binding }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        binding: [pyqt5, pyqt6]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: ${{ matrix.binding }}
      QT_OPENGL: software
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install system paint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install test dependencies
        run: python -m pip install -e ".[testing,${{ matrix.binding }}]"
      - name: Run semantic history paint smoke tests
        run: python -B -m pytest test/widgets_dag_history_test.py -k 'semantic_paint_smoke' -q

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: styfle/cancel-workflow-action@0.13.1
      - uses: actions/checkout@v7
      - name: Get current date for caching
        id: get-date
        shell: bash
        run: |
          echo date=$(date -u +%Y-%m-%d) >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        id: cache
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ steps.get-date.outputs.date }}
      - name: Install Rust and Garden
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          cargo install garden-tools
      - name: Install dependencies
        run: |
          brew untap aws/tap || true
          brew install git-cola
      - name: Build macOS git-cola.app bundle
        run: garden macos/app -vv -D cola-app='${TREE_PATH}/local/git-cola.app'
      - name: Upload git-cola.app.zip
        uses: actions/upload-artifact@v7
        with:
          name: git-cola.app
          path: local
